# API Configuration Template
# Copy this file to settings.yaml and fill in your values

exchange:
  binance:
    api_key: "YOUR_BINANCE_API_KEY"
    api_secret: "YOUR_BINANCE_API_SECRET"
    testnet: true

  okx:
    api_key: "YOUR_OKX_API_KEY"
    api_secret: "YOUR_OKX_API_SECRET"
    passphrase: "YOUR_OKX_PASSPHRASE"

# Social Data API Configuration (for sentiment/hype metrics)
social_apis:
  # Reddit API (PRAW) - Free tier available
  # Get credentials: https://www.reddit.com/prefs/apps
  # Create a "script" type app, then use client_id and client_secret
  reddit:
    client_id: ""      # 14 character string under the app name
    client_secret: ""  # 27 character string
    user_agent: "claude_trade:v1.0 (by /u/your_username)"

  # CryptoCompare API - 100K calls/month free tier
  # Get key: https://www.cryptocompare.com/cryptopian/api-keys/
  cryptocompare:
    api_key: ""

  # CoinMarketCap API - 15K calls/month free tier
  # Get key: https://coinmarketcap.com/api/
  coinmarketcap:
    api_key: ""

data:
  # Data collection settings
  default_timeframe: "1d"
  default_limit: 1000
  cache_enabled: true
  cache_expire_hours: 24

analysis:
  # Analysis parameters
  rsi_period: 14
  ma_short: 7
  ma_long: 25
  bollinger_period: 20
  bollinger_std: 2

notification:
  # Alert settings (optional)
  telegram_bot_token: ""
  telegram_chat_id: ""

  # Data collection alert webhook
  alert:
    webhook_url: ""  # Slack or Telegram webhook URL
    webhook_type: "slack"  # Options: slack, telegram (default: slack)

# Whale Monitor Configuration
whale_monitor:
  # 大额交易阈值（native币数量）
  threshold_btc: 100  # BTC阈值：≥100 BTC（约$10,000,000）
  threshold_eth: 1000  # ETH阈值：≥1000 ETH（约$4,000,000）

  # 轮询检查间隔（秒）
  check_interval: 600  # 每10分钟检查一次

  # Bitcoin whale monitoring
  btc:
    enabled: true
    # BTC price in USD (0 = auto fetch from CoinGecko)
    price_usd: 0

  # Ethereum whale monitoring
  eth:
    enabled: true
    # Etherscan API key (or set ETHERSCAN_API_KEY env var)
    api_key: ""
    # ETH price in USD (0 = auto fetch from CoinGecko)
    price_usd: 0
    # Watch addresses for large transactions
    # These are example addresses - replace with actual whale addresses
    watch_addresses:
      - "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"  # Example
      - "0x28C6C06298d514Db089934071355E5743bf21d60"  # Example

  # WebSocket real-time monitoring (placeholder for future)
  # Priority: WebSocket first, fallback to REST API on failure
  websocket:
    enabled: false
    # Future configuration:
    # endpoints:
    #   - "wss://ws.blockchain.info/inv"
    # reconnect_interval: 30
